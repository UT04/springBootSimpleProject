spring:
  datasource:
#    url: jdbc:sqlite:./data/mydatabase-sqlite.db
#    driver-class-name: org.sqlite.JDBC
    url: jdbc:h2:file:./data/mydatabase-h2.db
    driver-class-name: org.h2.Driver
