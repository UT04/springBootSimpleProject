server:
  port: 8080

spring:
  application:
    name: psinrigt-boot-project

  # --- Datenbank-Konfiguration ---
  datasource:
    # SQLite (auskommentiert)
    # url: jdbc:sqlite:./data/mydatabase-sqlite.db
    # driver-class-name: org.sqlite.JDBC
    
    # H2 (aktiv)
    url: jdbc:h2:file:./data/mydatabase-h2.db
    driver-class-name: org.h2.Driver
    username: 
    password: 

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      # H2: Validiert das Schema bei jedem Start
      ddl-auto: validate
      
      # SQLite (auskommentiert)
      # ddl-auto: none
      
    properties:
      hibernate:
        # Für SQLite wäre ein custom Dialect nötig
        # dialect: com.example.demo.config.SQLiteDialect

  # --- H2 Console ---
  h2:
    console:
      enabled: true
      path: /h2-console

# --- SpringDoc OpenAPI (Swagger) ---
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  package-to-vendor-extensions: com.example.demo

# --- Liquibase ---
liquibase:
  change-log: classpath:db/changelog/db.changelog-master.yaml
  enabled: true

# --- Thymeleaf ---
thymeleaf:
  cache: false
  prefix: classpath:/templates/
  suffix: .html
