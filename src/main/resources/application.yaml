spring:
  datasource:
    url: jdbc:sqlite:./data/mydatabase.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: com.example.demo.config.SQLiteDialect

liquibase:
  change-log: classpath:db/changelog/db.changelog-master.yaml
  enabled: true

thymeleaf:
  cache: false
  prefix: classpath:/templates/
  suffix: .html
