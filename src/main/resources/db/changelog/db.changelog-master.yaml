databaseChangeLog:
- changeSet:
    id: 1
    author: yourname
    changes:
      - createTable:
          tableName: person
          columns:
            - column:
                name: id
                type: integer
                autoIncrement: true
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: name
                type: varchar(100)
                constraints:
                  nullable: false
            - column:
                name: email
                type: varchar(100)
                constraints:
                  nullable: false
