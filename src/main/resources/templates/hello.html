<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hallo-Seite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Hallo, <span th:text="${name}">Benutzer</span>!</h1>

        <!-- Formular zum Weiterleiten zur Personenerstellung -->
        <form th:action="@{/persons}" method="get" class="mt-4">
            <input type="hidden" name="name" th:value="${name}">
            <div class="mb-3">
                <label for="email" class="form-label">E-Mail (optional)</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>
            <button type="submit" class="btn btn-primary">Weiter zur Personenerstellung</button>
        </form>
    </div>
</body>
</html>
